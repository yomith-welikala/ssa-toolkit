[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "sgp4>=2.23", "astropy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
